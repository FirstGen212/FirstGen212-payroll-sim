<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employer Portal (training)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230f766e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/portal.css">
</head>
<body data-app="portal">
  <header class="topbar">
    <div class="brand">Employer <span>Portal</span> <small>Training only · fictitious data</small></div>
    <div class="context">
      <label>Sandbox <select id="ws-select"></select></label>
      <label>Company <select id="company-select"></select></label>
      <button id="reset-btn" class="ghost">Reset sandbox</button>
      <span id="who"></span>
      <button id="logout-btn" class="ghost">Sign out</button>
    </div>
  </header>
  <div id="auth-screen" hidden></div>
  <div class="layout">
    <nav class="sidenav">
      <div class="nav-group">Portal</div>
      <a href="#/clients">Companies</a>
      <a href="#/queue">Onboarding Queue</a>
      <a href="#/csm">Proposal Requested</a>
      <a href="#/census">Census Review</a>
      <a href="#/activity">Activity Log</a>
      <div class="nav-group">Training</div>
      <a href="#/assignments">My Assignments</a>
      <a href="#/admin" class="trainer-only">Training Admin</a>
      <div class="nav-group">Other tools</div>
      <a href="/" target="payrollsim-payroll" class="external">Payroll System ↗</a>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
