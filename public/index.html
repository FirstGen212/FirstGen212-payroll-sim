<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f5fbf%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body data-app="payroll">
  <header class="topbar">
    <div class="brand">Payroll<span>Sim</span> <small>Training only · fictitious data</small></div>
    <div class="context">
      <label>Sandbox <select id="ws-select"></select></label>
      <label>Company <select id="company-select"></select></label>
      <button id="reset-btn" class="ghost">Reset sandbox</button>
      <span id="who"></span>
      <button id="logout-btn" class="ghost">Sign out</button>
    </div>
  </header>
  <div id="auth-screen" hidden></div>
  <div class="layout">
    <nav class="sidenav">
      <div class="nav-group">Payroll System</div>
      <a href="#/dashboard">Dashboard</a>
      <a href="#/employees">Employees</a>
      <a href="#/setup">Earnings &amp; Deductions</a>
      <a href="#/payroll">Run Payroll</a>
      <a href="#/reports">Reports</a>
      <a href="#/import">Import / Census</a>
      <div class="nav-group">Training</div>
      <a href="#/assignments">My Assignments</a>
      <a href="#/admin" class="trainer-only">Training Admin</a>
      <div class="nav-group">Other tools</div>
      <a href="/portal" target="payrollsim-portal" class="external">Employer Portal ↗</a>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
